<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skills - SkillServer Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 2L4 8v16l12 6 12-6V8L16 2z" fill="#512BD4"/><path d="M16 6l-8 4v12l8 4 8-4V10L16 6z" fill="#1a1a2e"/><path d="M14 14c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2z" fill="#00D4AA"/><path d="M12 20l4-2 4 2-4 2-4-2z" fill="#00D4AA"/><path d="M10 18l2 2-2 2-2-2 2-2z" fill="#512BD4"/><path d="M22 18l-2 2 2 2 2-2-2-2z" fill="#512BD4"/></svg>
      <div class="nav-brand-text">SkillServer<span>Gallery</span></div>
    </a>
    <div class="nav-links">
      <a href="/skills/" class="nav-link active">Skills</a>
      <a href="/subagents/" class="nav-link">Sub-agents</a>
      <a href="#" class="nav-link">Docs</a>
    </div>
  </div>
</nav>

<main class="main" id="app">
  <div class="loading">Loading...</div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">Made with <span class="heart">❤️</span> by Petabridge</div>
    <div class="footer-links">
      <a href="https://netclaw.dev">netclaw.dev</a>
      <span>·</span>
      <a href="https://petabridge.com">petabridge.com</a>
      <span>·</span>
      <a href="https://github.com/netclaw-dev">GitHub</a>
    </div>
    <div class="footer-version"><span data-app-version-label>SkillServer</span> · Self-hosted agent infrastructure</div>
  </div>
</footer>

<script type="module">
import { fetchSkills, fetchSkillVersions, fetchSkillMd, fetchSkillResources, fetchSkillResource, getSkillResourceUrl } from '/js/api.js';
import { renderAppVersion } from '/js/footer.js';
import { getSkillName, getSkillVersion } from '/js/router.js';

renderAppVersion();

const app = document.getElementById('app');
const skillName = getSkillName();
const requestedVersion = getSkillVersion();
let selectedFileRequestId = 0;

if (skillName) {
    await renderDetail(skillName, requestedVersion);
} else {
    await renderListing();
}

async function renderListing() {
    document.title = 'Skills - SkillServer Gallery';
    try {
        const params = new URLSearchParams(window.location.search);
        const initialQuery = params.get('q');
        const skills = await fetchSkills(initialQuery || undefined);
        app.innerHTML = `
            <div class="breadcrumb">
                <a href="/">Home</a> <span>›</span> Skills
            </div>
            <div class="page-header">
                <div>
                    <h1>${initialQuery ? 'Search Results' : 'All Skills'}</h1>
                    <p>${initialQuery ? `"${initialQuery}" — ${skills.length} result${skills.length !== 1 ? 's' : ''}` : 'Browse reusable capabilities for your agents'}</p>
                </div>
                <div class="search-wrap-inline">
                    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                    <input type="text" class="search-input" id="search" placeholder="Search skills..." value="${initialQuery || ''}">
                </div>
            </div>
            <div class="skill-list" id="skill-list">
                ${skills.length === 0 ? '<p>No skills found.</p>' : skills.map(renderSkillCard).join('')}
            </div>
        `;
        document.getElementById('search').addEventListener('input', async (e) => {
            const q = e.target.value.trim();
            const filtered = await fetchSkills(q || undefined);
            document.getElementById('skill-list').innerHTML =
                filtered.length === 0 ? '<p>No skills found.</p>' : filtered.map(renderSkillCard).join('');
            document.querySelector('.page-header h1').textContent = q ? 'Search Results' : 'All Skills';
            document.querySelector('.page-header p').textContent = q
                ? `"${q}" — ${filtered.length} result${filtered.length !== 1 ? 's' : ''}`
                : 'Browse reusable capabilities for your agents';
        });
    } catch (err) {
        app.innerHTML = `<div class="error">Failed to load skills: ${err.message}</div>`;
    }
}

async function renderDetail(name, version) {
    document.title = `${name} - SkillServer Gallery`;
    try {
        const versions = await fetchSkillVersions(name);
        const targetVersion = version 
            ? (versions.find(v => v.version === version) || versions.find(v => v.isLatest) || versions[0])
            : (versions.find(v => v.isLatest) || versions[0]);
        document.title = `${name}${version ? ' v' + targetVersion.version : ''} - SkillServer Gallery`;
        const [skillMd, resources] = await Promise.all([
            fetchSkillMd(name, targetVersion.version),
            fetchSkillResources(name, targetVersion.version)
        ]);
        app.innerHTML = `
            <div class="breadcrumb">
                <a href="/">Home</a> <span>›</span>
                <a href="/skills/">Skills</a> <span>›</span>
                <a href="/skills/${encodeURIComponent(name)}/">${name}</a>
                ${version ? `<span>›</span><span>v${targetVersion.version}</span>` : ''}
            </div>
            <div class="detail-header">
                <div class="detail-title">
                    <h1>${name}</h1>
                    <span class="detail-version">v${targetVersion.version} ${targetVersion.isLatest ? '<span class="latest">← latest</span>' : ''}</span>
                </div>
                ${targetVersion.category ? `<div class="tags" style="margin-bottom:16px"><span class="tag">${targetVersion.category}</span></div>` : ''}
                <p class="detail-description">${targetVersion.description || ''}</p>
                <div class="detail-meta">
                    <div class="meta-item"><span class="meta-label">Versions</span><span class="meta-value">${versions.length}</span></div>
                    <div class="meta-item"><span class="meta-label">Size</span><span class="meta-value">${formatBytes(targetVersion.sizeBytes)}</span></div>
                    <div class="meta-item"><span class="meta-label">Published</span><span class="meta-value">${formatDate(targetVersion.publishedAt)}</span></div>
                </div>
            </div>
            <section class="section">
                <div class="section-header">
                    <h2>Files</h2>
                </div>
                <div class="file-browser">
                    <div class="file-tree" aria-label="Skill files">
                        ${renderFileTree(targetVersion, resources)}
                    </div>
                    <div class="file-preview" id="file-preview">
                        ${renderTextPreview(createSkillMdFile(targetVersion), skillMd)}
                    </div>
                </div>
            </section>
            <section class="section">
                <div class="section-header">
                    <h2>Version History</h2>
                </div>
                <div class="version-list">
                    ${versions.map(v => `
                        <a href="/skills/${encodeURIComponent(name)}/v/${encodeURIComponent(v.version)}/" class="version-row ${v.version === targetVersion.version ? 'current' : ''} ${v.isLatest && v.version !== targetVersion.version ? 'latest-link' : ''}" role="button" tabindex="0">
                            <span class="version-tag ${v.version === targetVersion.version && v.isLatest ? 'latest' : ''}">v${v.version}</span>
                            <span class="version-date">${formatDate(v.publishedAt)}</span>
                            <span class="version-size">${formatBytes(v.sizeBytes)}</span>
                        </a>
                    `).join('')}
                </div>
            </section>
        `;
        wireFileBrowser(name, targetVersion.version, targetVersion, skillMd, resources);
    } catch (err) {
        app.innerHTML = `<div class="error">Failed to load skill: ${err.message}</div>`;
    }
}

function renderSkillCard(skill) {
    return `
        <a href="/skills/${encodeURIComponent(skill.name)}/" class="skill-card">
            <div class="skill-info">
                <div class="skill-name">${skill.name}</div>
                <div class="skill-desc">${skill.description || ''}</div>
            </div>
            <div class="skill-meta">
                <span class="skill-version">v${skill.latestVersion}</span>
                ${skill.category ? `<div class="tags"><span class="tag">${skill.category}</span></div>` : ''}
            </div>
        </a>
    `;
}

function createSkillMdFile(version) {
    return {
        path: 'SKILL.md',
        sizeBytes: version.sizeBytes,
        contentType: 'text/markdown',
        previewable: true,
        language: 'markdown'
    };
}

function renderFileTree(version, resources) {
    const rows = [{ type: 'file', depth: 0, file: createSkillMdFile(version) }];
    const seenDirectories = new Set();

    for (const resource of resources.slice().sort((a, b) => a.path.localeCompare(b.path))) {
        const segments = resource.path.split('/');

        for (let i = 0; i < segments.length - 1; i++) {
            const directoryPath = segments.slice(0, i + 1).join('/');
            if (seenDirectories.has(directoryPath)) continue;

            seenDirectories.add(directoryPath);
            rows.push({ type: 'directory', depth: i, name: segments[i] });
        }

        rows.push({ type: 'file', depth: segments.length - 1, file: resource });
    }

    return rows.map(row => row.type === 'directory'
        ? `<div class="file-tree-row directory" style="--depth:${row.depth}"><span class="file-icon">▸</span><span>${escapeHtml(row.name)}/</span></div>`
        : renderFileTreeButton(row.file, row.depth)).join('');
}

function renderFileTreeButton(file, depth) {
    const active = file.path === 'SKILL.md' ? ' active' : '';
    const meta = file.path === 'SKILL.md' ? 'entry' : formatBytes(file.sizeBytes);

    return `
        <button type="button" class="file-tree-row file${active}" style="--depth:${depth}" data-file-path="${escapeAttribute(file.path)}">
            <span class="file-icon">${file.previewable ? '•' : '⬢'}</span>
            <span class="file-name">${escapeHtml(file.path.split('/').pop())}</span>
            <span class="file-tree-meta">${escapeHtml(meta)}</span>
        </button>
    `;
}

function wireFileBrowser(name, version, targetVersion, skillMd, resources) {
    const preview = document.getElementById('file-preview');
    if (!preview) return;

    const files = new Map(resources.map(resource => [resource.path, resource]));
    files.set('SKILL.md', createSkillMdFile(targetVersion));

    document.querySelectorAll('[data-file-path]').forEach(button => {
        button.addEventListener('click', async () => {
            const path = button.getAttribute('data-file-path');
            const file = files.get(path);
            if (!file) return;

            document.querySelectorAll('[data-file-path]').forEach(item => item.classList.remove('active'));
            button.classList.add('active');

            await renderSelectedFile(preview, name, version, file, skillMd, ++selectedFileRequestId);
        });
    });
}

async function renderSelectedFile(preview, name, version, file, skillMd, requestId) {
    if (!file.previewable) {
        preview.innerHTML = renderUnavailablePreview(name, version, file);
        return;
    }

    preview.innerHTML = `<div class="file-preview-state">Loading ${escapeHtml(file.path)}...</div>`;

    try {
        const content = file.path === 'SKILL.md'
            ? skillMd
            : await fetchSkillResource(name, version, file.path);
        if (requestId !== selectedFileRequestId) return;

        preview.innerHTML = renderTextPreview(file, content);
    } catch (err) {
        if (requestId !== selectedFileRequestId) return;

        preview.innerHTML = `<div class="error">Failed to load ${escapeHtml(file.path)}: ${escapeHtml(err.message)}</div>`;
    }
}

function renderTextPreview(file, content) {
    return `
        <div class="file-preview-header">
            <div>
                <div class="file-preview-title">${escapeHtml(file.path)}</div>
                <div class="file-preview-subtitle">${escapeHtml(file.contentType || 'text/plain')}</div>
            </div>
            <div class="file-preview-meta">${file.language ? escapeHtml(file.language) : 'text'} · ${formatBytes(file.sizeBytes)}</div>
        </div>
        <div class="code-block file-code"><pre><code class="language-${escapeAttribute(file.language || 'text')}">${escapeHtml(content)}</code></pre></div>
    `;
}

function renderUnavailablePreview(name, version, file) {
    const url = getSkillResourceUrl(name, version, file.path);
    return `
        <div class="file-preview-header">
            <div>
                <div class="file-preview-title">${escapeHtml(file.path)}</div>
                <div class="file-preview-subtitle">${escapeHtml(file.contentType || 'application/octet-stream')}</div>
            </div>
            <div class="file-preview-meta">${formatBytes(file.sizeBytes)}</div>
        </div>
        <div class="file-preview-state">
            Preview unavailable for this file type or size.
            <a href="${escapeAttribute(url)}" target="_blank" rel="noopener">Open raw file</a>
        </div>
    `;
}

function formatBytes(bytes) {
    if (!bytes) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 2592000000) return Math.floor(diff / 86400000) + 'd ago';
    return d.toLocaleDateString();
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

function escapeAttribute(str) {
    return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('"', '&quot;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;');
}
</script>

</body>
</html>
