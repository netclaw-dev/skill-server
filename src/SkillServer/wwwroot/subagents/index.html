<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub-agents - SkillServer Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 2L4 8v16l12 6 12-6V8L16 2z" fill="#512BD4"/><path d="M16 6l-8 4v12l8 4 8-4V10L16 6z" fill="#1a1a2e"/><path d="M14 14c0-1.1.9-2 2-2s2 .9 2 2-.9 2-2 2-2-.9-2-2z" fill="#00D4AA"/><path d="M12 20l4-2 4 2-4 2-4-2z" fill="#00D4AA"/><path d="M10 18l2 2-2 2-2-2 2-2z" fill="#512BD4"/><path d="M22 18l-2 2 2 2 2-2-2-2z" fill="#512BD4"/></svg>
      <div class="nav-brand-text">SkillServer<span>Gallery</span></div>
    </a>
    <div class="nav-links">
      <a href="/skills/" class="nav-link">Skills</a>
      <a href="/subagents/" class="nav-link active">Sub-agents</a>
      <a href="#" class="nav-link">Docs</a>
    </div>
  </div>
</nav>

<main class="main" id="app">
  <div class="loading">Loading...</div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">Made with <span class="heart">❤️</span> by Petabridge</div>
    <div class="footer-links">
      <a href="https://netclaw.dev">netclaw.dev</a>
      <span>·</span>
      <a href="https://petabridge.com">petabridge.com</a>
      <span>·</span>
      <a href="https://github.com/netclaw-dev">GitHub</a>
    </div>
    <div class="footer-version">SkillServer v0.5.0 · Self-hosted agent infrastructure</div>
  </div>
</footer>

<script type="module">
import { fetchSubAgents, fetchSubAgentVersions, fetchAgentMd } from '/js/api.js';
import { getSubAgentName } from '/js/router.js';

const app = document.getElementById('app');
const agentName = getSubAgentName();

if (agentName) {
    await renderDetail(agentName);
} else {
    await renderListing();
}

async function renderListing() {
    document.title = 'Sub-agents - SkillServer Gallery';
    try {
        const agents = await fetchSubAgents();
        app.innerHTML = `
            <div class="breadcrumb">
                <a href="/">Home</a> <span>›</span> Sub-agents
            </div>
            <div class="page-header">
                <div>
                    <h1>All Sub-agents</h1>
                    <p>Browse specialized agents for your workflows</p>
                </div>
            </div>
            <div class="agent-grid" id="agent-list">
                ${agents.length === 0 ? '<p>No sub-agents found.</p>' : agents.map(renderAgentCard).join('')}
            </div>
        `;
    } catch (err) {
        app.innerHTML = `<div class="error">Failed to load sub-agents: ${err.message}</div>`;
    }
}

async function renderDetail(name) {
    document.title = `${name} - SkillServer Gallery`;
    try {
        const versions = await fetchSubAgentVersions(name);
        const latest = versions.find(v => v.isLatest) || versions[0];
        const agentMd = await fetchAgentMd(name, latest.version);
        app.innerHTML = `
            <div class="breadcrumb">
                <a href="/">Home</a> <span>›</span>
                <a href="/subagents/">Sub-agents</a> <span>›</span>
                ${name}
            </div>
            <div class="detail-header">
                <div class="detail-title">
                    <h1>${name}</h1>
                    <span class="detail-version">v${latest.version} ${latest.isLatest ? '<span class="latest">← latest</span>' : ''}</span>
                </div>
                <p class="detail-description">${latest.description || ''}</p>
                <div class="detail-meta">
                    <div class="meta-item"><span class="meta-label">Role</span><span class="meta-value">${latest.modelRole || '—'}</span></div>
                    <div class="meta-item"><span class="meta-label">Timeout</span><span class="meta-value">${latest.timeoutSeconds ? latest.timeoutSeconds + 's' : '—'}</span></div>
                    <div class="meta-item"><span class="meta-label">Visibility</span><span class="meta-value">${latest.visibility || '—'}</span></div>
                    <div class="meta-item"><span class="meta-label">Versions</span><span class="meta-value">${versions.length}</span></div>
                </div>
            </div>
            <section class="section">
                <div class="section-header">
                    <h2>agent.md</h2>
                </div>
                <div class="code-block"><pre>${escapeHtml(agentMd)}</pre></div>
            </section>
            <section class="section">
                <div class="section-header">
                    <h2>Version History</h2>
                </div>
                <div class="version-list">
                    ${versions.map(v => `
                        <div class="version-row ${v.isLatest ? 'current' : ''}">
                            <span class="version-tag ${v.isLatest ? 'latest' : ''}">v${v.version}</span>
                            <span class="version-date">${formatDate(v.publishedAt)}</span>
                            <span class="version-size">${formatBytes(v.sizeBytes)}</span>
                        </div>
                    `).join('')}
                </div>
            </section>
        `;
    } catch (err) {
        app.innerHTML = `<div class="error">Failed to load sub-agent: ${err.message}</div>`;
    }
}

function renderAgentCard(agent) {
    return `
        <a href="/subagents/${encodeURIComponent(agent.name)}/" class="agent-card">
            <div class="agent-header">
                <div class="agent-name">${agent.name}</div>
            </div>
            <div class="agent-body">${agent.description || ''}</div>
            <div class="agent-footer">
                <span class="agent-stat">v${agent.latestVersion}</span>
            </div>
        </a>
    `;
}

function formatBytes(bytes) {
    if (!bytes) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 2592000000) return Math.floor(diff / 86400000) + 'd ago';
    return d.toLocaleDateString();
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}
</script>

</body>
</html>
