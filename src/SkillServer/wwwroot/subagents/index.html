<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sub-agents - SkillServer Gallery</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="nav-brand">
      <img src="/logo.svg" alt="" width="32" height="32">
      <div class="nav-brand-text">SkillServer<span>Gallery</span></div>
    </a>
    <div class="nav-links">
      <a href="/skills/" class="nav-link">Skills</a>
      <a href="/subagents/" class="nav-link active">Sub-agents</a>
      <a href="#" class="nav-link">Docs</a>
    </div>
  </div>
</nav>

<main class="main" id="app">
  <div class="loading">Loading...</div>
</main>

<footer class="footer">
  <div class="footer-inner">
    <div class="footer-brand">Made with <span class="heart">❤️</span> by Petabridge</div>
    <div class="footer-links">
      <a href="https://netclaw.dev">netclaw.dev</a>
      <span>·</span>
      <a href="https://petabridge.com">petabridge.com</a>
      <span>·</span>
      <a href="https://github.com/netclaw-dev">GitHub</a>
    </div>
    <div class="footer-version"><span data-app-version-label>SkillServer</span> · Self-hosted agent infrastructure</div>
  </div>
</footer>

<script type="module">
import { fetchSubAgents, fetchSubAgentVersions, fetchAgentMd } from '/js/api.js';
import { renderAppVersion } from '/js/footer.js';
import { getSubAgentName, getSubAgentVersion } from '/js/router.js';

renderAppVersion();

const app = document.getElementById('app');
const agentName = getSubAgentName();
const requestedVersion = getSubAgentVersion();

if (agentName) {
    await renderDetail(agentName, requestedVersion);
} else {
    await renderListing();
}

async function renderListing() {
    document.title = 'Sub-agents - SkillServer Gallery';
    try {
        const agents = await fetchSubAgents();
        app.innerHTML = `
            <div class="breadcrumb">
                <a href="/">Home</a> <span>›</span> Sub-agents
            </div>
            <div class="page-header">
                <div>
                    <h1>All Sub-agents</h1>
                    <p>Browse specialized agents for your workflows</p>
                </div>
            </div>
            <div class="agent-grid" id="agent-list">
                ${agents.length === 0 ? '<p>No sub-agents found.</p>' : agents.map(renderAgentCard).join('')}
            </div>
        `;
    } catch (err) {
        app.innerHTML = `<div class="error">Failed to load sub-agents: ${err.message}</div>`;
    }
}

async function renderDetail(name, version) {
    document.title = `${name} - SkillServer Gallery`;
    try {
        const versions = await fetchSubAgentVersions(name);
        const targetVersion = version
            ? (versions.find(v => v.version === version) || versions.find(v => v.isLatest) || versions[0])
            : (versions.find(v => v.isLatest) || versions[0]);
        document.title = `${name}${version ? ' v' + targetVersion.version : ''} - SkillServer Gallery`;
        const agentMd = await fetchAgentMd(name, targetVersion.version);
        app.innerHTML = `
            <div class="breadcrumb">
                <a href="/">Home</a> <span>›</span>
                <a href="/subagents/">Sub-agents</a> <span>›</span>
                <a href="/subagents/${encodeURIComponent(name)}/">${name}</a>
                ${version ? `<span>›</span><span>v${targetVersion.version}</span>` : ''}
            </div>
            <div class="detail-header">
                <div class="detail-title">
                    <h1>${name}</h1>
                    <span class="detail-version">v${targetVersion.version} ${targetVersion.isLatest ? '<span class="latest">← latest</span>' : ''}</span>
                </div>
                <p class="detail-description">${targetVersion.description || ''}</p>
                <div class="detail-meta">
                    <div class="meta-item"><span class="meta-label">Role</span><span class="meta-value">${targetVersion.modelRole || '—'}</span></div>
                    <div class="meta-item"><span class="meta-label">Timeout</span><span class="meta-value">${targetVersion.timeoutSeconds ? targetVersion.timeoutSeconds + 's' : '—'}</span></div>
                    <div class="meta-item"><span class="meta-label">Visibility</span><span class="meta-value">${targetVersion.visibility || '—'}</span></div>
                    <div class="meta-item"><span class="meta-label">Versions</span><span class="meta-value">${versions.length}</span></div>
                </div>
            </div>
            <section class="section">
                <div class="section-header">
                    <h2>agent.md</h2>
                </div>
                <div class="code-block-wrap">
                    <div class="code-block-toolbar">
                        <span class="file-preview-meta">markdown</span>
                        <button class="copy-btn" onclick="copyToClipboard(this)" title="Copy to clipboard">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                            Copy
                        </button>
                    </div>
                    <div class="code-block"><pre>${escapeHtml(agentMd)}</pre></div>
                </div>
            </section>
            <section class="section">
                <div class="section-header">
                    <h2>Version History</h2>
                </div>
                <div class="version-list">
                    ${versions.map(v => `
                        <a href="/subagents/${encodeURIComponent(name)}/v/${encodeURIComponent(v.version)}/" class="version-row ${v.version === targetVersion.version ? 'current' : ''} ${v.isLatest && v.version !== targetVersion.version ? 'latest-link' : ''}" role="button" tabindex="0">
                            <span class="version-tag ${v.version === targetVersion.version && v.isLatest ? 'latest' : ''}">v${v.version}</span>
                            <span class="version-date">${formatDate(v.publishedAt)}</span>
                            <span class="version-size">${formatBytes(v.sizeBytes)}</span>
                        </a>
                    `).join('')}
                </div>
            </section>
        `;
    } catch (err) {
        app.innerHTML = `<div class="error">Failed to load sub-agent: ${err.message}</div>`;
    }
}

function renderAgentCard(agent) {
    return `
        <a href="/subagents/${encodeURIComponent(agent.name)}/" class="agent-card">
            <div class="agent-header">
                <div class="agent-name">${agent.name}</div>
            </div>
            <div class="agent-body">${agent.description || ''}</div>
            <div class="agent-footer">
                <span class="agent-stat">v${agent.latestVersion}</span>
            </div>
        </a>
    `;
}

function formatBytes(bytes) {
    if (!bytes) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function formatDate(dateStr) {
    if (!dateStr) return '—';
    const d = new Date(dateStr);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return 'just now';
    if (diff < 3600000) return Math.floor(diff / 60000) + 'm ago';
    if (diff < 86400000) return Math.floor(diff / 3600000) + 'h ago';
    if (diff < 2592000000) return Math.floor(diff / 86400000) + 'd ago';
    return d.toLocaleDateString();
}

function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
}

window.copyToClipboard = function(btn) {
    var header = btn.closest('.file-preview-header');
    var wrap = btn.closest('.code-block-wrap');
    var codeBlock = header ? header.nextElementSibling : wrap ? wrap.querySelector('.code-block') : null;
    if (!codeBlock) return;
    var text = codeBlock.textContent;
    navigator.clipboard.writeText(text).then(function() {
        var orig = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!';
        setTimeout(function() {
            btn.classList.remove('copied');
            btn.innerHTML = orig;
        }, 2000);
    });
}
</script>

</body>
</html>
